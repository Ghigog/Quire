# QUI-001 — build and test on every push and pull request.
#
# The second job is the interesting one. Cloud dev containers for this project cannot reach
# dl.google.com, so neither the Android SDK nor the Android Gradle Plugin resolves there and
# the probe cannot be built by an agent (CLAUDE.md §9). GitHub's runners ship the SDK, so CI
# can build it and attach the APK to the run — which is how the device gets a build without
# anyone's laptop being involved.
#
# The third job exists for the same reason in a different direction. The voice probes answer
# whether a knob reaches the model; whether the result *sounds* like an accent, or like a
# person, only ears can say. So CI renders the audio and attaches it next to the APK, and a
# tester picks up one run and has both.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM tests and module boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test checkModuleBoundaries --stacktrace
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn

  probe:
    name: TTS probe APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # Neither is committed: the AAR is 38 MB of native ONNX Runtime, and the index is
      # derived from a labelled fixture that is under version control instead (CLAUDE.md §6).
      - name: Fetch the sherpa-onnx AAR
        run: ./tools/fetch-sherpa-aar.sh
      - name: Build the slice index asset
        run: ./tools/build-slice-index.sh

      # gradlew locates the wrapper by its own path and the project by the working
      # directory, so this builds the probe's standalone build, not the root one.
      - name: Assemble
        working-directory: spike/ttsbinding
        run: ../../gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: quire-probe-apk
          path: spike/ttsbinding/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The book the index was built from, so a tester gets a matching pair rather than
      # having to remember which fixture the APK was cut against.
      - name: Upload the slice book
        uses: actions/upload-artifact@v4
        with:
          name: slice-book
          path: build/slice/*.epub
          if-no-files-found: error

  voices:
    name: Voice probe audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the probe dependencies
        run: python3 -m pip install --quiet sherpa-onnx onnx numpy

      # Only the incumbent. The full list in the script is 1.1 GB and the other six models
      # have nothing to do with either probe.
      - name: Fetch libritts_r
        working-directory: spike/hostbench
        run: ./fetch-models.sh vits-piper-en_US-libritts_r-medium

      # `shell: bash` for pipefail: without it `tee` would swallow a probe that died.
      # The console output goes into the artifact beside the audio, because it is the only
      # place the measurement each file was rendered from is written down.
      - name: Render the accent variants (QUI-033)
        shell: bash
        working-directory: spike/hostbench
        run: |
          mkdir -p ../../build/voice-probes
          python3 voiceprobe.py --mode accent --wav-dir ../../build/voice-probes \
            | tee ../../build/voice-probes/accent-probe.txt

      - name: Render the blend ramp (QUI-036)
        shell: bash
        working-directory: spike/hostbench
        run: |
          python3 voicelab.py blend --wav-dir ../../build/voice-probes \
            | tee ../../build/voice-probes/blend-probe.txt

      - name: Upload the probe audio
        uses: actions/upload-artifact@v4
        with:
          name: voice-probe-wavs
          path: build/voice-probes/*
          if-no-files-found: error
